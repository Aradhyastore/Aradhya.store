<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aradhya Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: #f5f0e6;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       LOGIN
    ========================= */

    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at top, rgba(170, 130, 45, 0.15), transparent 45%),
        #0b0b0b;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      padding: 35px;
      background: #111;
      border: 1px solid #8c6b28;
      border-radius: 14px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand h1 {
      margin: 0;
      color: #c9a646;
      font-family: Georgia, serif;
      font-size: 34px;
      letter-spacing: 2px;
    }

    .brand p {
      margin: 8px 0 0;
      color: #aaa;
      font-size: 14px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: #d6b85a;
      font-size: 14px;
    }

    .field input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #4d3b18;
      border-radius: 8px;
      outline: none;
      background: #090909;
      color: #fff;
    }

    .field input:focus {
      border-color: #c9a646;
    }

    .primary-btn {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      background: #b9973e;
      color: #080808;
      font-weight: bold;
    }

    .primary-btn:hover {
      background: #d0af54;
    }

    .error {
      margin-top: 14px;
      min-height: 20px;
      color: #ff7777;
      text-align: center;
      font-size: 14px;
    }

    .login-help {
      margin-top: 20px;
      color: #777;
      text-align: center;
      font-size: 12px;
      line-height: 1.6;
    }

    /* =========================
       DASHBOARD
    ========================= */

    .dashboard {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 15px 24px;
      background: rgba(12, 12, 12, 0.96);
      border-bottom: 1px solid #3e3017;
      backdrop-filter: blur(10px);
    }

    .topbar-title h1 {
      margin: 0;
      color: #c9a646;
      font-family: Georgia, serif;
      font-size: 25px;
    }

    .topbar-title p {
      margin: 4px 0 0;
      color: #888;
      font-size: 12px;
    }

    .top-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .top-buttons button {
      padding: 9px 13px;
      border: 1px solid #6e5420;
      border-radius: 7px;
      background: #151515;
      color: #d8bd69;
      cursor: pointer;
    }

    .top-buttons button:hover {
      background: #241d0d;
    }

    .container {
      width: 100%;
      max-width: 1450px;
      margin: auto;
      padding: 24px;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-card {
      padding: 18px;
      background: #111;
      border: 1px solid #352914;
      border-radius: 12px;
    }

    .stat-card span {
      display: block;
      color: #888;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-card strong {
      color: #d1b35b;
      font-size: 27px;
    }

    /* =========================
       FILTERS
    ========================= */

    .filters {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .filters input,
    .filters select {
      width: 100%;
      padding: 12px;
      border: 1px solid #443516;
      border-radius: 8px;
      background: #111;
      color: #eee;
      outline: none;
    }

    .filters input:focus,
    .filters select:focus {
      border-color: #b9973e;
    }

    .refresh-info {
      color: #777;
      font-size: 12px;
      margin-bottom: 18px;
    }

    /* =========================
       ORDERS
    ========================= */

    .orders {
      display: grid;
      gap: 18px;
    }

    .order-card {
      background: #111;
      border: 1px solid #392c15;
      border-radius: 14px;
      overflow: hidden;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      padding: 18px;
      border-bottom: 1px solid #29200f;
      background: #15130e;
    }

    .order-id {
      color: #d5b75c;
      font-weight: bold;
      font-size: 17px;
    }

    .order-date {
      margin-top: 5px;
      color: #777;
      font-size: 12px;
    }

    .status-badge {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 20px;
      background: #241d0c;
      border: 1px solid #705720;
      color: #d9bb61;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
    }

    .order-body {
      padding: 18px;
    }

    .customer-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px 20px;
      margin-bottom: 20px;
    }

    .customer-item {
      color: #bbb;
      font-size: 13px;
      line-height: 1.6;
    }

    .customer-item strong {
      color: #ddd;
    }

    .address {
      grid-column: 1 / -1;
    }

    .items-title {
      margin-bottom: 10px;
      color: #d2b45c;
      font-weight: bold;
    }

    .items-table-wrapper {
      overflow-x: auto;
    }

    .items-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    .items-table th,
    .items-table td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #28200f;
      font-size: 13px;
    }

    .items-table th {
      color: #9e8443;
      font-weight: normal;
    }

    .items-table td {
      color: #ccc;
    }

    .order-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #29200f;
    }

    .total-box {
      color: #aaa;
    }

    .total-box strong {
      color: #e0c36b;
      font-size: 22px;
    }

    .delivery-note {
      margin-top: 7px;
      color: #999;
      font-size: 12px;
    }

    .order-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .order-actions select {
      padding: 10px;
      border: 1px solid #514019;
      border-radius: 7px;
      background: #0b0b0b;
      color: #ddd;
    }

    .save-status-btn {
      padding: 10px 14px;
      border: 1px solid #8c6b28;
      border-radius: 7px;
      background: #b9973e;
      color: #090909;
      font-weight: bold;
      cursor: pointer;
    }

    .save-status-btn:hover {
      background: #d2b158;
    }

    .empty {
      padding: 55px 20px;
      text-align: center;
      background: #111;
      border: 1px dashed #443516;
      border-radius: 12px;
      color: #888;
    }

    .loading {
      padding: 35px;
      text-align: center;
      color: #aaa;
    }

    .success-message {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 100;
      padding: 13px 18px;
      border: 1px solid #66501e;
      border-radius: 8px;
      background: #15120a;
      color: #d8bd67;
      box-shadow: 0 10px 35px rgba(0,0,0,.4);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 900px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .filters {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 650px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .container {
        padding: 15px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .customer-grid {
        grid-template-columns: 1fr;
      }

      .address {
        grid-column: auto;
      }

      .order-header {
        flex-direction: column;
      }

      .order-footer {
        align-items: stretch;
        flex-direction: column;
      }

      .order-actions {
        width: 100%;
      }

      .order-actions select,
      .save-status-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN
  ========================= -->

  <div id="loginBox" class="login-wrapper">

    <div class="login-box">

      <div class="brand">
        <h1>ARADHYA</h1>
        <p>Admin Order Management</p>
      </div>

      <div class="field">
        <label for="adminKey">Admin Key</label>

        <input
          type="password"
          id="adminKey"
          placeholder="Enter your Cloudflare Admin Key"
          autocomplete="off"
        >
      </div>

      <button
        class="primary-btn"
        onclick="login()"
      >
        Login to Dashboard
      </button>

      <div
        id="loginError"
        class="error"
      ></div>

      <div class="login-help">
        Use the same <strong>ADMIN_KEY</strong> secret configured
        inside your Aradhya Cloudflare Worker.
      </div>

    </div>

  </div>


  <!-- =========================
       DASHBOARD
  ========================= -->

  <div
    id="dashboard"
    class="dashboard hidden"
  >

    <header class="topbar">

      <div class="topbar-title">
        <h1>Aradhya Admin</h1>
        <p>Orders &amp; Order Management</p>
      </div>

      <div class="top-buttons">

        <button onclick="loadOrders(true)">
          ↻ Refresh
        </button>

        <button onclick="logout()">
          Logout
        </button>

      </div>

    </header>


    <main class="container">

      <!-- STATS -->

      <section class="stats">

        <div class="stat-card">
          <span>Total Orders</span>
          <strong id="totalOrders">0</strong>
        </div>

        <div class="stat-card">
          <span>New Orders</span>
          <strong id="newOrders">0</strong>
        </div>

        <div class="stat-card">
          <span>Delivered</span>
          <strong id="deliveredOrders">0</strong>
        </div>

        <div class="stat-card">
          <span>Total Product Value</span>
          <strong id="totalSales">₹0</strong>
        </div>

      </section>


      <!-- FILTERS -->

      <section class="filters">

        <input
          id="searchInput"
          type="text"
          placeholder="Search by order ID, name, phone or email..."
          oninput="applyFilters()"
        >

        <select
          id="statusFilter"
          onchange="applyFilters()"
        >
          <option value="all">
            All Order Status
          </option>

          <option value="new">
            New
          </option>

          <option value="confirmed">
            Confirmed
          </option>

          <option value="preparing">
            Preparing
          </option>

          <option value="shipped">
            Shipped
          </option>

          <option value="delivered">
            Delivered
          </option>

          <option value="cancelled">
            Cancelled
          </option>
        </select>


        <select
          id="paymentFilter"
          onchange="applyFilters()"
        >
          <option value="all">
            All Payment Status
          </option>

          <option value="pending">
            Pending
          </option>

          <option value="paid">
            Paid
          </option>

          <option value="failed">
            Failed
          </option>

          <option value="refunded">
            Refunded
          </option>
        </select>

      </section>


      <div
        id="lastUpdated"
        class="refresh-info"
      >
        Not loaded yet.
      </div>


      <!-- ORDERS -->

      <div
        id="orders"
        class="orders"
      ></div>

    </main>

  </div>


  <script>

    /* =========================================================
       ARADHYA CLOUDFLARE WORKER
       ========================================================= */

    const WORKER_URL =
      "https://aradhyabackend.www-aradhya-co.workers.dev";


    let adminKey = "";
    let allOrders = [];
    let refreshTimer = null;


    /* =========================================================
       LOGIN
       ========================================================= */

    async function login() {

      const input =
        document.getElementById("adminKey");

      const error =
        document.getElementById("loginError");

      const key =
        input.value.trim();

      if (!key) {

        error.textContent =
          "Please enter your Admin Key.";

        return;
      }

      adminKey = key;

      error.textContent = "";

      await loadOrders(false, true);
    }


    /* =========================================================
       LOAD ORDERS
       ========================================================= */

    async function loadOrders(
      showMessage = false,
      firstLogin = false
    ) {

      if (!adminKey) {
        return;
      }

      const ordersContainer =
        document.getElementById("orders");

      if (firstLogin) {

        ordersContainer.innerHTML =
          '<div class="loading">Connecting to Aradhya backend...</div>';

      }

      try {

        const response =
          await fetch(
            WORKER_URL + "/admin/orders",
            {
              method: "GET",

              headers: {
                "X-Admin-Key": adminKey
              }
            }
          );


        let data = {};

        try {
          data = await response.json();
        } catch (e) {
          data = {};
        }


        /* =========================
           INVALID KEY
        ========================= */

        if (
          response.status === 401 ||
          data.success === false
        ) {

          if (firstLogin) {

            document.getElementById(
              "loginError"
            ).textContent =
              "Invalid Admin Key. Please check the ADMIN_KEY in Cloudflare.";

            ordersContainer.innerHTML = "";

          } else {

            alert(
              "Admin authentication failed. Please login again."
            );

            logout();
          }

          return;
        }


        /* =========================
           OTHER SERVER ERROR
        ========================= */

        if (!response.ok) {

          const message =
            data.message ||
            "Unable to load orders.";

          if (firstLogin) {

            document.getElementById(
              "loginError"
            ).textContent =
              message;

            ordersContainer.innerHTML = "";

          } else {

            alert(message);

          }

          return;
        }


        /* =========================
           SUCCESS
        ========================= */

        allOrders =
          Array.isArray(data.orders)
            ? data.orders
            : [];


        document
          .getElementById("loginBox")
          .classList.add("hidden");


        document
          .getElementById("dashboard")
          .classList.remove("hidden");


        updateStats();

        applyFilters();


        document.getElementById(
          "lastUpdated"
        ).textContent =
          "Last updated: " +
          new Date().toLocaleString();


        if (showMessage) {

          showSuccess(
            "Orders refreshed successfully."
          );

        }


        startAutoRefresh();

      } catch (error) {

        console.error(error);

        ordersContainer.innerHTML = "";

        if (firstLogin) {

          document.getElementById(
            "loginError"
          ).textContent =
            "Could not connect to the Aradhya backend. Please check the Worker.";

        } else {

          alert(
            "Could not connect to the Aradhya backend."
          );

        }

      }

    }


    /* =========================================================
       AUTO REFRESH
       ========================================================= */

    function startAutoRefresh() {

      if (refreshTimer) {
        clearInterval(refreshTimer);
      }

      refreshTimer =
        setInterval(
          () => loadOrders(false, false),
          30000
        );

    }


    /* =========================================================
       STATS
       ========================================================= */

    function updateStats() {

      const total =
        allOrders.length;


      const newCount =
        allOrders.filter(
          order =>
            String(order.order_status || order.status || "")
              .toLowerCase() === "new"
        ).length;


      const delivered =
        allOrders.filter(
          order =>
            String(order.order_status || order.status || "")
              .toLowerCase() === "delivered"
        ).length;


      const sales =
        allOrders.reduce(
          (sum, order) => {

            const value =
              Number(
                order.total ||
                order.order_total ||
                0
              );

            return sum + value;

          },
          0
        );


      document.getElementById(
        "totalOrders"
      ).textContent = total;


      document.getElementById(
        "newOrders"
      ).textContent = newCount;


      document.getElementById(
        "deliveredOrders"
      ).textContent = delivered;


      document.getElementById(
        "totalSales"
      ).textContent =
        formatMoney(sales);

    }


    /* =========================================================
       FILTERS
       ========================================================= */

    function applyFilters() {

      const search =
        document
          .getElementById("searchInput")
          .value
          .trim()
          .toLowerCase();


      const status =
        document
          .getElementById("statusFilter")
          .value
          .toLowerCase();


      const payment =
        document
          .getElementById("paymentFilter")
          .value
          .toLowerCase();


      const filtered =
        allOrders.filter(
          order => {

            const orderId =
              String(
                order.order_id ||
                order.id ||
                ""
              ).toLowerCase();


            const name =
              String(
                order.customer_name ||
                ""
              ).toLowerCase();


            const phone =
              String(
                order.customer_phone ||
                ""
              ).toLowerCase();


            const email =
              String(
                order.customer_email ||
                ""
              ).toLowerCase();


            const currentStatus =
              normalizeStatus(
                order.order_status ||
                order.status ||
                "new"
              );


            const paymentStatus =
              String(
                order.payment_status ||
                "pending"
              ).toLowerCase();


            const matchesSearch =
              !search ||
              orderId.includes(search) ||
              name.includes(search) ||
              phone.includes(search) ||
              email.includes(search);


            const matchesStatus =
              status === "all" ||
              currentStatus === status;


            const matchesPayment =
              payment === "all" ||
              paymentStatus === payment;


            return (
              matchesSearch &&
              matchesStatus &&
              matchesPayment
            );

          }
        );


      renderOrders(filtered);

    }


    /* =========================================================
       NORMALIZE STATUS
       ========================================================= */

    function normalizeStatus(status) {

      status =
        String(status || "")
          .toLowerCase();


      if (status === "processing") {
        return "preparing";
      }

      return status || "new";

    }


    /* =========================================================
       DISPLAY STATUS
       ========================================================= */

    function displayStatus(status) {

      const normalized =
        normalizeStatus(status);


      const labels = {
        new: "New",
        confirmed: "Confirmed",
        preparing: "Preparing",
        shipped: "Shipped",
        delivered: "Delivered",
        cancelled: "Cancelled"
      };


      return labels[normalized] ||
        normalized;

    }


    /* =========================================================
       RENDER ORDERS
       ========================================================= */

    function renderOrders(orders) {

      const container =
        document.getElementById("orders");


      if (!orders.length) {

        container.innerHTML =
          `
          <div class="empty">
            <h3>No orders found</h3>
            <p>
              There are currently no orders matching your filters.
            </p>
          </div>
          `;

        return;
      }


      container.innerHTML =
        orders
          .map(
            order =>
              createOrderCard(order)
          )
          .join("");

    }


    /* =========================================================
       ORDER CARD
       ========================================================= */

    function createOrderCard(order) {

      const orderId =
        order.order_id ||
        order.id ||
        "N/A";


      const status =
        normalizeStatus(
          order.order_status ||
          order.status ||
          "new"
        );


      const paymentStatus =
        order.payment_status ||
        "pending";


      const customerName =
        order.customer_name ||
        "N/A";


      const phone =
        order.customer_phone ||
        "N/A";


      const email =
        order.customer_email ||
        "N/A";


      const address =
        order.customer_address ||
        "N/A";


      const total =
        Number(
          order.total ||
          order.order_total ||
          0
        );


      const createdAt =
        order.created_at ||
        order.createdAt ||
        "";


      const items =
        Array.isArray(order.items)
          ? order.items
          : [];


      const notes =
        order.customer_notes ||
        order.notes ||
        "";


      const itemsHtml =
        items.length
          ? items
              .map(
                item => {

                  const name =
                    item.product_name ||
                    item.name ||
                    "Product";


                  const quantity =
                    Number(
                      item.quantity ||
                      item.qty ||
                      1
                    );


                  const price =
                    Number(
                      item.unit_price ??
                      item.price ??
                      0
                    );


                  const lineTotal =
                    Number(
                      item.line_total ??
                      (price * quantity)
                    );


                  return `
                    <tr>
                      <td>${escapeHtml(name)}</td>
                      <td>${quantity}</td>
                      <td>${formatMoney(price)}</td>
                      <td>${formatMoney(lineTotal)}</td>
                    </tr>
                  `;

                }
              )
              .join("")
          :
            `
              <tr>
                <td colspan="4">
                  No item details available.
                </td>
              </tr>
            `;


      return `
        <article class="order-card">

          <div class="order-header">

            <div>
              <div class="order-id">
                Order #${escapeHtml(String(orderId))}
              </div>

              <div class="order-date">
                ${escapeHtml(formatDate(createdAt))}
              </div>
            </div>

            <div class="status-badge">
              ${escapeHtml(displayStatus(status))}
            </div>

          </div>


          <div class="order-body">

            <div class="customer-grid">

              <div class="customer-item">
                <strong>Name:</strong>
                ${escapeHtml(String(customerName))}
              </div>

              <div class="customer-item">
                <strong>Phone:</strong>
                ${escapeHtml(String(phone))}
              </div>

              <div class="customer-item">
                <strong>Email:</strong>
                ${escapeHtml(String(email))}
              </div>

              <div class="customer-item">
                <strong>Payment:</strong>
                ${escapeHtml(String(paymentStatus))}
              </div>

              <div class="customer-item address">
                <strong>Address:</strong>
                ${escapeHtml(String(address))}
              </div>

            </div>


            <div class="items-title">
              Products
            </div>


            <div class="items-table-wrapper">

              <table class="items-table">

                <thead>
                  <tr>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Unit Price</th>
                    <th>Total</th>
                  </tr>
                </thead>

                <tbody>
                  ${itemsHtml}
                </tbody>

              </table>

            </div>


            <div class="order-footer">

              <div class="total-box">

                Product Total:
                <strong>
                  ${formatMoney(total)}
                </strong>

                <div class="delivery-note">
                  Delivery charges will be confirmed according to the
                  delivery location on WhatsApp.
                </div>

                ${
                  notes
                    ? `
                      <div class="delivery-note">
                        ${escapeHtml(String(notes))}
                      </div>
                    `
                    : ""
                }

              </div>


              <div class="order-actions">

                <select
                  id="status-${escapeHtml(String(orderId))}"
                >

                  <option
                    value="new"
                    ${status === "new" ? "selected" : ""}
                  >
                    New
                  </option>

                  <option
                    value="confirmed"
                    ${status === "confirmed" ? "selected" : ""}
                  >
                    Confirmed
                  </option>

                  <option
                    value="preparing"
                    ${status === "preparing" ? "selected" : ""}
                  >
                    Preparing
                  </option>

                  <option
                    value="shipped"
                    ${status === "shipped" ? "selected" : ""}
                  >
                    Shipped
                  </option>

                  <option
                    value="delivered"
                    ${status === "delivered" ? "selected" : ""}
                  >
                    Delivered
                  </option>

                  <option
                    value="cancelled"
                    ${status === "cancelled" ? "selected" : ""}
                  >
                    Cancelled
                  </option>

                </select>


                <button
                  class="save-status-btn"
                  onclick="updateOrderStatus('${escapeJs(String(orderId))}')"
                >
                  Update Status
                </button>

              </div>

            </div>

          </div>

        </article>
      `;

    }


    /* =========================================================
       UPDATE ORDER STATUS
       ========================================================= */

    async function updateOrderStatus(orderId) {

      const select =
        document.getElementById(
          "status-" + orderId
        );


      if (!select) {
        return;
      }


      const newStatus =
        select.value;


      try {

        const response =
          await fetch(
            WORKER_URL +
            "/admin/orders/" +
            encodeURIComponent(orderId),
            {
              method: "PATCH",

              headers: {
                "Content-Type":
                  "application/json",

                "X-Admin-Key":
                  adminKey
              },

              body: JSON.stringify({
                order_status: newStatus
              })
            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          data.success === false
        ) {

          /* Legacy endpoint fallback */

          const fallback =
            await fetch(
              WORKER_URL +
              "/admin/update-status",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",

                  "X-Admin-Key":
                    adminKey
                },

                body: JSON.stringify({
                  order_id: orderId,
                  status: newStatus
                })
              }
            );


          const fallbackData =
            await fallback.json();


          if (
            !fallback.ok ||
            fallbackData.success === false
          ) {

            throw new Error(
              fallbackData.message ||
              data.message ||
              "Unable to update order status."
            );

          }

        }


        showSuccess(
          "Order status updated."
        );


        await loadOrders(false, false);

      } catch (error) {

        console.error(error);

        alert(
          error.message ||
          "Unable to update order status."
        );

      }

    }


    /* =========================================================
       LOGOUT
       ========================================================= */

    function logout() {

      adminKey = "";

      allOrders = [];


      if (refreshTimer) {

        clearInterval(
          refreshTimer
        );

        refreshTimer = null;

      }


      document
        .getElementById("dashboard")
        .classList.add("hidden");


      document
        .getElementById("loginBox")
        .classList.remove("hidden");


      document
        .getElementById("adminKey")
        .value = "";


      document
        .getElementById("loginError")
        .textContent = "";

    }


    /* =========================================================
       SUCCESS MESSAGE
       ========================================================= */

    function showSuccess(message) {

      const old =
        document.querySelector(
          ".success-message"
        );


      if (old) {
        old.remove();
      }


      const div =
        document.createElement("div");


      div.className =
        "success-message";


      div.textContent =
        message;


      document.body.appendChild(div);


      setTimeout(
        () => div.remove(),
        2500
      );

    }


    /* =========================================================
       FORMAT MONEY
       ========================================================= */

    function formatMoney(value) {

      const number =
        Number(value || 0);


      return "₹" +
        number.toLocaleString(
          "en-IN",
          {
            maximumFractionDigits: 2
          }
        );

    }


    /* =========================================================
       FORMAT DATE
       ========================================================= */

    function formatDate(value) {

      if (!value) {
        return "Date unavailable";
      }


      const date =
        new Date(value);


      if (Number.isNaN(date.getTime())) {
        return String(value);
      }


      return date.toLocaleString(
        "en-IN",
        {
          dateStyle: "medium",
          timeStyle: "short"
        }
      );

    }


    /* =========================================================
       HTML ESCAPE
       ========================================================= */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================================================
       JAVASCRIPT STRING ESCAPE
       ========================================================= */

    function escapeJs(value) {

      return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\n/g, "\\n")
        .replace(/\r/g, "\\r");

    }


    /* =========================================================
       ENTER KEY LOGIN
       ========================================================= */

    document
      .getElementById("adminKey")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            login();

          }

        }
      );

  </script>

</body>
</html>
