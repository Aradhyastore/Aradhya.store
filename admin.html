<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Aradhya Admin Dashboard</title>

  <meta
    name="description"
    content="Aradhya order management and admin dashboard."
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #241d0c 0%, #0b0b0b 42%, #050505 100%);
      color: #f5f0df;
      min-height: 100vh;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .gold {
      color: #c9a45c;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: rgba(15, 15, 15, 0.97);
      border: 1px solid #9b7a36;
      border-radius: 18px;
      padding: 35px;
      box-shadow:
        0 0 40px rgba(0, 0, 0, 0.7),
        0 0 30px rgba(201, 164, 92, 0.08);
      text-align: center;
    }

    .login-logo {
      width: 95px;
      height: 95px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    .login-card h1 {
      margin: 0 0 8px;
      color: #d6b56b;
      font-family: Georgia, serif;
      font-size: 30px;
    }

    .login-card p {
      color: #aaa;
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .field {
      text-align: left;
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      color: #d5bc85;
      margin-bottom: 7px;
      font-size: 13px;
    }

    .field input,
    .field select {
      width: 100%;
      background: #111;
      border: 1px solid #66532d;
      color: #fff;
      padding: 13px 14px;
      border-radius: 9px;
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: #c9a45c;
      box-shadow: 0 0 0 2px rgba(201, 164, 92, 0.1);
    }

    .primary-btn {
      width: 100%;
      background: linear-gradient(135deg, #d1ad60, #9b7630);
      border: none;
      color: #090909;
      font-weight: bold;
      padding: 14px 20px;
      border-radius: 9px;
      margin-top: 5px;
    }

    .primary-btn:hover {
      filter: brightness(1.1);
    }

    .error-box {
      display: none;
      background: rgba(120, 20, 20, 0.2);
      border: 1px solid #813434;
      color: #ffaaaa;
      padding: 11px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 13px;
      text-align: left;
    }

    .success-box {
      display: none;
      background: rgba(20, 100, 50, 0.2);
      border: 1px solid #357d4c;
      color: #a8e5b9;
      padding: 11px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 13px;
      text-align: left;
    }

    /* =========================
       DASHBOARD
    ========================= */

    #dashboard {
      display: none;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 8, 8, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #4f3d1c;
      padding: 14px 25px;
    }

    .topbar-inner {
      max-width: 1450px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-area img {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }

    .brand-title {
      font-family: Georgia, serif;
      color: #d6b56b;
      font-size: 22px;
      font-weight: bold;
    }

    .brand-subtitle {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid #765c2c;
      color: #d6b56b;
      padding: 9px 15px;
      border-radius: 7px;
    }

    .logout-btn:hover {
      background: #211a0c;
    }

    .container {
      width: 100%;
      max-width: 1450px;
      margin: auto;
      padding: 25px;
    }

    .page-heading {
      margin-bottom: 22px;
    }

    .page-heading h1 {
      font-family: Georgia, serif;
      color: #d8b66d;
      margin: 0 0 5px;
      font-size: 30px;
    }

    .page-heading p {
      color: #888;
      margin: 0;
      font-size: 14px;
    }

    /* =========================
       STATS
    ========================= */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 22px;
    }

    .stat-card {
      background: rgba(18, 18, 18, 0.96);
      border: 1px solid #49391c;
      border-radius: 12px;
      padding: 20px;
    }

    .stat-label {
      color: #999;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 27px;
      font-weight: bold;
      color: #d8b66d;
    }

    /* =========================
       TOOLBAR
    ========================= */

    .toolbar {
      background: rgba(17, 17, 17, 0.97);
      border: 1px solid #49391c;
      border-radius: 13px;
      padding: 17px;
      margin-bottom: 22px;
    }

    .toolbar-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 12px;
    }

    .toolbar input,
    .toolbar select {
      width: 100%;
      background: #0b0b0b;
      color: #eee;
      border: 1px solid #55431f;
      padding: 11px 12px;
      border-radius: 8px;
      outline: none;
    }

    .toolbar input:focus,
    .toolbar select:focus {
      border-color: #b28e49;
    }

    .refresh-btn {
      background: #18140b;
      border: 1px solid #80642e;
      color: #d6b56b;
      border-radius: 8px;
      padding: 11px 18px;
      white-space: nowrap;
    }

    .refresh-btn:hover {
      background: #271e0c;
    }

    .last-updated {
      color: #666;
      font-size: 11px;
      margin-top: 10px;
    }

    /* =========================
       STATUS MESSAGE
    ========================= */

    #dashboardMessage {
      display: none;
      margin-bottom: 20px;
      padding: 13px;
      border-radius: 8px;
      font-size: 13px;
    }

    .message-error {
      background: rgba(120, 20, 20, 0.2);
      border: 1px solid #733333;
      color: #ffadad;
    }

    .message-success {
      background: rgba(20, 100, 50, 0.18);
      border: 1px solid #347849;
      color: #a9e5b9;
    }

    /* =========================
       ORDERS
    ========================= */

    #ordersContainer {
      display: grid;
      gap: 18px;
    }

    .empty-orders {
      text-align: center;
      padding: 50px 20px;
      color: #777;
      background: rgba(16, 16, 16, 0.95);
      border: 1px solid #3f321b;
      border-radius: 13px;
    }

    .order-card {
      background: rgba(15, 15, 15, 0.97);
      border: 1px solid #4a3a1d;
      border-radius: 15px;
      overflow: hidden;
    }

    .order-header {
      padding: 17px 20px;
      border-bottom: 1px solid #332817;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .order-number {
      color: #d9b76b;
      font-size: 17px;
      font-weight: bold;
    }

    .order-date {
      color: #777;
      font-size: 12px;
      margin-top: 4px;
    }

    .status-pill {
      padding: 7px 12px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: bold;
      border: 1px solid #5d4925;
      background: #17130a;
      color: #d6b56b;
    }

    .status-new {
      color: #ffd98b;
    }

    .status-confirmed {
      color: #a8d9ff;
    }

    .status-preparing {
      color: #e6c58c;
    }

    .status-shipped {
      color: #c9b4ff;
    }

    .status-delivered {
      color: #9ee5ad;
    }

    .status-cancelled {
      color: #ff9d9d;
    }

    .order-body {
      padding: 20px;
    }

    .order-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    .info-section h3 {
      color: #c9a45c;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0 0 10px;
    }

    .info-line {
      color: #ccc;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 5px;
      word-break: break-word;
    }

    .info-line strong {
      color: #f0e5cb;
    }

    .address-box {
      background: #0b0b0b;
      border: 1px solid #302618;
      border-radius: 8px;
      padding: 11px;
      color: #bbb;
      line-height: 1.6;
      font-size: 13px;
      white-space: pre-wrap;
    }

    /* =========================
       ITEMS
    ========================= */

    .items-section {
      margin-top: 22px;
    }

    .items-table-wrapper {
      overflow-x: auto;
      border: 1px solid #332817;
      border-radius: 9px;
    }

    .items-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    .items-table th {
      background: #17130c;
      color: #c9a45c;
      font-size: 11px;
      text-align: left;
      padding: 11px;
      border-bottom: 1px solid #3c2e19;
    }

    .items-table td {
      padding: 11px;
      border-bottom: 1px solid #211b12;
      color: #ccc;
      font-size: 13px;
    }

    .items-table tr:last-child td {
      border-bottom: none;
    }

    .total-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 15px;
    }

    .total-box {
      min-width: 260px;
      background: #111;
      border: 1px solid #5a4522;
      border-radius: 10px;
      padding: 15px;
    }

    .total-line {
      display: flex;
      justify-content: space-between;
      gap: 25px;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .total-line.grand-total {
      border-top: 1px solid #3e3019;
      padding-top: 10px;
      margin-top: 10px;
      color: #e0bf75;
      font-size: 18px;
      font-weight: bold;
    }

    .delivery-note {
      margin-top: 10px;
      padding: 11px;
      background: rgba(139, 106, 40, 0.08);
      border: 1px solid #49391c;
      border-radius: 8px;
      color: #bca66f;
      font-size: 12px;
      line-height: 1.5;
    }

    /* =========================
       ORDER ACTIONS
    ========================= */

    .order-actions {
      margin-top: 20px;
      padding-top: 17px;
      border-top: 1px solid #302618;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .status-control {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .status-control label {
      color: #999;
      font-size: 12px;
    }

    .status-control select {
      background: #0a0a0a;
      color: #e5d7b9;
      border: 1px solid #594522;
      padding: 9px 11px;
      border-radius: 7px;
      outline: none;
    }

    .update-btn {
      background: linear-gradient(135deg, #cda95d, #96712e);
      color: #080808;
      border: none;
      border-radius: 7px;
      padding: 10px 18px;
      font-weight: bold;
    }

    .update-btn:hover {
      filter: brightness(1.1);
    }

    .update-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      text-align: center;
      padding: 45px;
      color: #b99a5b;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #3b301d;
      border-top-color: #c9a45c;
      border-radius: 50%;
      margin: 0 auto 12px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1000px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .toolbar-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 700px) {
      .container {
        padding: 17px;
      }

      .topbar {
        padding: 11px 15px;
      }

      .topbar-inner {
        align-items: flex-start;
      }

      .brand-area img {
        width: 43px;
        height: 43px;
      }

      .brand-title {
        font-size: 18px;
      }

      .page-heading h1 {
        font-size: 25px;
      }

      .stats-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .stat-card {
        padding: 15px;
      }

      .stat-value {
        font-size: 22px;
      }

      .toolbar-grid {
        grid-template-columns: 1fr;
      }

      .order-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .order-header {
        padding: 15px;
      }

      .order-body {
        padding: 15px;
      }

      .order-actions {
        align-items: stretch;
      }

      .status-control {
        width: 100%;
      }

      .status-control select {
        flex: 1;
      }

      .update-btn {
        width: 100%;
      }

      .login-card {
        padding: 27px 20px;
      }
    }

    @media (max-width: 430px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .logout-btn {
        padding: 7px 10px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       LOGIN SCREEN
  ========================================================== -->

  <section id="loginScreen">

    <div class="login-card">

      <!--
        This image is optional.
        If your logo path is different, the dashboard still works.
      -->
      <img
        src="assets/logo/aradhya-logo.png"
        alt="Aradhya"
        class="login-logo"
        onerror="this.style.display='none'"
      />

      <h1>Aradhya Admin</h1>

      <p>
        Secure order management dashboard.
        Enter your Cloudflare Admin Key to continue.
      </p>

      <div class="field">
        <label for="adminKey">Admin Key</label>

        <input
          type="password"
          id="adminKey"
          placeholder="Enter Admin Key"
          autocomplete="off"
        />
      </div>

      <button
        type="button"
        class="primary-btn"
        id="loginBtn"
        onclick="login()"
      >
        Login & Load Orders
      </button>

      <div id="loginError" class="error-box"></div>

      <div id="loginSuccess" class="success-box"></div>

    </div>

  </section>


  <!-- =========================================================
       DASHBOARD
  ========================================================== -->

  <section id="dashboard">

    <header class="topbar">

      <div class="topbar-inner">

        <div class="brand-area">

          <img
            src="assets/logo/aradhya-logo.png"
            alt="Aradhya"
            onerror="this.style.display='none'"
          />

          <div>
            <div class="brand-title">Aradhya</div>
            <div class="brand-subtitle">
              Order Management Dashboard
            </div>
          </div>

        </div>

        <button
          type="button"
          class="logout-btn"
          onclick="logout()"
        >
          Logout
        </button>

      </div>

    </header>


    <main class="container">

      <div class="page-heading">

        <h1>Orders</h1>

        <p>
          Manage Aradhya customer orders, payments and delivery status.
        </p>

      </div>


      <!-- ================= STATS ================= -->

      <div class="stats-grid">

        <div class="stat-card">
          <div class="stat-label">TOTAL ORDERS</div>
          <div class="stat-value" id="statTotal">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">NEW ORDERS</div>
          <div class="stat-value" id="statNew">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">DELIVERED</div>
          <div class="stat-value" id="statDelivered">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">PRODUCT VALUE</div>
          <div class="stat-value" id="statValue">₹0</div>
        </div>

      </div>


      <!-- ================= TOOLBAR ================= -->

      <div class="toolbar">

        <div class="toolbar-grid">

          <input
            type="search"
            id="searchInput"
            placeholder="Search by order ID, customer, phone..."
            oninput="renderOrders()"
          />

          <select
            id="statusFilter"
            onchange="renderOrders()"
          >
            <option value="">All Statuses</option>
            <option value="new">New</option>
            <option value="confirmed">Confirmed</option>
            <option value="preparing">Preparing</option>
            <option value="shipped">Shipped</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>

          <select
            id="paymentFilter"
            onchange="renderOrders()"
          >
            <option value="">All Payments</option>
            <option value="pending">Pending</option>
            <option value="paid">Paid</option>
            <option value="failed">Failed</option>
            <option value="cod">COD</option>
          </select>

          <button
            type="button"
            class="refresh-btn"
            onclick="loadOrders()"
          >
            ↻ Refresh
          </button>

        </div>

        <div class="last-updated" id="lastUpdated">
          Not loaded yet
        </div>

      </div>


      <!-- ================= MESSAGE ================= -->

      <div id="dashboardMessage"></div>


      <!-- ================= ORDERS ================= -->

      <div id="ordersContainer">

        <div class="loading">

          <div class="spinner"></div>

          Loading orders...

        </div>

      </div>

    </main>

  </section>


  <script>

    /* =========================================================
       ARADHYA BACKEND CONFIGURATION
    ========================================================== */

    const WORKER_URL =
      "https://aradhyabackend.www-aradhya-co.workers.dev";


    /*
      IMPORTANT:

      Do NOT put your actual ADMIN_KEY here.

      The key is entered into the login box and sent securely
      through the X-Admin-Key request header.

      Your Cloudflare Worker must have:

        Secret name: ADMIN_KEY

      and the value must exactly match the key you enter here.
    */


    /* =========================================================
       GLOBAL VARIABLES
    ========================================================== */

    let adminKey = "";
    let allOrders = [];

    let refreshTimer = null;


    /* =========================================================
       HELPERS
    ========================================================== */

    function $(id) {
      return document.getElementById(id);
    }


    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function formatCurrency(value) {

      const number = Number(value || 0);

      return "₹" + number.toLocaleString("en-IN", {
        maximumFractionDigits: 2
      });
    }


    function formatDate(value) {

      if (!value) {
        return "Date unavailable";
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return escapeHtml(value);
      }

      return date.toLocaleString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }


    function normalizeStatus(status) {

      const value = String(status || "new").toLowerCase();

      /*
        Older D1 schema may contain "processing".
        The dashboard displays it as "preparing".
      */

      if (value === "processing") {
        return "preparing";
      }

      return value;
    }


    function statusLabel(status) {

      const normalized = normalizeStatus(status);

      const labels = {
        new: "New",
        confirmed: "Confirmed",
        preparing: "Preparing",
        shipped: "Shipped",
        delivered: "Delivered",
        cancelled: "Cancelled"
      };

      return labels[normalized] || normalized;
    }


    function showDashboardMessage(message, type = "error") {

      const box = $("dashboardMessage");

      box.className =
        type === "success"
          ? "message-success"
          : "message-error";

      box.textContent = message;
      box.style.display = "block";

      setTimeout(() => {

        box.style.display = "none";

      }, 5000);
    }


    function showLoginError(message) {

      const error = $("loginError");

      error.textContent = message;
      error.style.display = "block";

      $("loginSuccess").style.display = "none";
    }


    function showLoginSuccess(message) {

      const success = $("loginSuccess");

      success.textContent = message;
      success.style.display = "block";

      $("loginError").style.display = "none";
    }


    /* =========================================================
       LOGIN
    ========================================================== */

    async function login() {

      const key = $("adminKey").value.trim();

      if (!key) {

        showLoginError("Please enter your Admin Key.");

        return;
      }

      const button = $("loginBtn");

      button.disabled = true;
      button.textContent = "Checking...";

      try {

        /*
          First check that the Worker is online.
        */

        const healthResponse =
          await fetch(
            WORKER_URL + "/health",
            {
              method: "GET"
            }
          );


        if (!healthResponse.ok) {

          throw new Error(
            "The Aradhya backend is not responding."
          );

        }


        /*
          Now verify the Admin Key by requesting orders.
        */

        const response =
          await fetch(
            WORKER_URL + "/admin/orders",
            {
              method: "GET",

              headers: {
                "X-Admin-Key": key
              }
            }
          );


        const data =
          await response.json()
            .catch(() => ({}));


        if (
          response.status === 401 ||
          response.status === 403
        ) {

          throw new Error(
            "Invalid Admin Key. Please make sure the key exactly matches the ADMIN_KEY secret in Cloudflare."
          );

        }


        if (!response.ok) {

          throw new Error(
            data.message ||
            data.error ||
            "Unable to access the admin dashboard."
          );

        }


        /*
          Login successful.
        */

        adminKey = key;

        sessionStorage.setItem(
          "aradhya_admin_key",
          key
        );


        allOrders =
          extractOrders(data);


        $("loginScreen").style.display = "none";
        $("dashboard").style.display = "block";


        updateStatistics();
        renderOrders();


        $("lastUpdated").textContent =
          "Last updated: " +
          new Date().toLocaleTimeString("en-IN");


        showLoginSuccess("Login successful.");


        startAutoRefresh();

      } catch (error) {

        console.error("Admin login error:", error);

        showLoginError(
          error.message ||
          "Login failed. Please try again."
        );

      } finally {

        button.disabled = false;
        button.textContent = "Login & Load Orders";

      }
    }


    /* =========================================================
       AUTO LOGIN FROM SESSION
    ========================================================== */

    async function restoreSession() {

      const savedKey =
        sessionStorage.getItem(
          "aradhya_admin_key"
        );

      if (!savedKey) {
        return;
      }


      adminKey = savedKey;

      try {

        const response =
          await fetch(
            WORKER_URL + "/admin/orders",
            {
              method: "GET",
              headers: {
                "X-Admin-Key": adminKey
              }
            }
          );


        if (!response.ok) {

          sessionStorage.removeItem(
            "aradhya_admin_key"
          );

          adminKey = "";

          return;
        }


        const data =
          await response.json();


        allOrders =
          extractOrders(data);


        $("loginScreen").style.display = "none";
        $("dashboard").style.display = "block";


        updateStatistics();
        renderOrders();


        $("lastUpdated").textContent =
          "Last updated: " +
          new Date().toLocaleTimeString("en-IN");


        startAutoRefresh();

      } catch (error) {

        console.error(
          "Session restore failed:",
          error
        );

        sessionStorage.removeItem(
          "aradhya_admin_key"
        );

        adminKey = "";
      }
    }


    /* =========================================================
       LOGOUT
    ========================================================== */

    function logout() {

      stopAutoRefresh();

      adminKey = "";
      allOrders = [];

      sessionStorage.removeItem(
        "aradhya_admin_key"
      );

      $("dashboard").style.display = "none";
      $("loginScreen").style.display = "flex";

      $("adminKey").value = "";

      $("loginError").style.display = "none";
      $("loginSuccess").style.display = "none";

    }


    /* =========================================================
       LOAD ORDERS
    ========================================================== */

    async function loadOrders() {

      if (!adminKey) {
        return;
      }


      try {

        const response =
          await fetch(
            WORKER_URL + "/admin/orders",
            {
              method: "GET",

              headers: {
                "X-Admin-Key": adminKey
              }
            }
          );


        const data =
          await response.json()
            .catch(() => ({}));


        if (
          response.status === 401 ||
          response.status === 403
        ) {

          logout();

          showLoginError(
            "Your Admin Key is invalid or has changed."
          );

          return;
        }


        if (!response.ok) {

          throw new Error(
            data.message ||
            data.error ||
            "Failed to load orders."
          );

        }


        allOrders =
          extractOrders(data);


        updateStatistics();
        renderOrders();


        $("lastUpdated").textContent =
          "Last updated: " +
          new Date().toLocaleTimeString("en-IN");


      } catch (error) {

        console.error(
          "Load orders error:",
          error
        );

        showDashboardMessage(
          error.message ||
          "Unable to load orders."
        );

      }
    }


    /* =========================================================
       EXTRACT ORDERS
    ========================================================== */

    function extractOrders(data) {

      /*
        Supports several common backend response formats.
      */

      if (Array.isArray(data)) {
        return data;
      }

      if (
        data &&
        Array.isArray(data.orders)
      ) {
        return data.orders;
      }

      if (
        data &&
        data.data &&
        Array.isArray(data.data.orders)
      ) {
        return data.data.orders;
      }

      if (
        data &&
        data.data &&
        Array.isArray(data.data)
      ) {
        return data.data;
      }

      return [];
    }


    /* =========================================================
       STATISTICS
    ========================================================== */

    function updateStatistics() {

      const total =
        allOrders.length;


      const newOrders =
        allOrders.filter(
          order =>
            normalizeStatus(
              order.order_status ||
              order.status
            ) === "new"
        ).length;


      const delivered =
        allOrders.filter(
          order =>
            normalizeStatus(
              order.order_status ||
              order.status
            ) === "delivered"
        ).length;


      let productValue = 0;


      allOrders.forEach(order => {

        const totalValue =
          Number(
            order.total ||
            order.product_total ||
            order.grand_total ||
            0
          );

        productValue += totalValue;

      });


      $("statTotal").textContent =
        total;


      $("statNew").textContent =
        newOrders;


      $("statDelivered").textContent =
        delivered;


      $("statValue").textContent =
        formatCurrency(productValue);

    }


    /* =========================================================
       FILTER ORDERS
    ========================================================== */

    function getFilteredOrders() {

      const search =
        $("searchInput")
          .value
          .trim()
          .toLowerCase();


      const status =
        $("statusFilter").value;


      const payment =
        $("paymentFilter").value;


      return allOrders.filter(order => {

        const orderId =
          String(
            order.order_id ||
            order.id ||
            ""
          ).toLowerCase();


        const customer =
          String(
            order.customer_name ||
            order.name ||
            ""
          ).toLowerCase();


        const phone =
          String(
            order.customer_phone ||
            order.phone ||
            ""
          ).toLowerCase();


        const email =
          String(
            order.customer_email ||
            order.email ||
            ""
          ).toLowerCase();


        const currentStatus =
          normalizeStatus(
            order.order_status ||
            order.status
          );


        const currentPayment =
          String(
            order.payment_status ||
            order.payment_method ||
            ""
          ).toLowerCase();


        const searchMatch =
          !search ||
          orderId.includes(search) ||
          customer.includes(search) ||
          phone.includes(search) ||
          email.includes(search);


        const statusMatch =
          !status ||
          currentStatus === status;


        const paymentMatch =
          !payment ||
          currentPayment === payment;


        return (
          searchMatch &&
          statusMatch &&
          paymentMatch
        );

      });

    }


    /* =========================================================
       RENDER ORDERS
    ========================================================== */

    function renderOrders() {

      const container =
        $("ordersContainer");


      const orders =
        getFilteredOrders();


      if (!orders.length) {

        container.innerHTML = `
          <div class="empty-orders">
            No orders found.
          </div>
        `;

        return;
      }


      container.innerHTML =
        orders
          .map(
            order =>
              renderOrderCard(order)
          )
          .join("");

    }


    /* =========================================================
       RENDER SINGLE ORDER
    ========================================================== */

    function renderOrderCard(order) {

      const orderId =
        order.order_id ||
        order.id ||
        "N/A";


      const customerName =
        order.customer_name ||
        order.name ||
        "N/A";


      const phone =
        order.customer_phone ||
        order.phone ||
        "N/A";


      const email =
        order.customer_email ||
        order.email ||
        "N/A";


      const address =
        order.customer_address ||
        order.address ||
        "N/A";


      const rawStatus =
        order.order_status ||
        order.status ||
        "new";


      const status =
        normalizeStatus(rawStatus);


      const paymentStatus =
        order.payment_status ||
        "pending";


      const paymentMethod =
        order.payment_method ||
        "cod";


      const createdAt =
        order.created_at ||
        order.createdAt;


      const total =
        Number(
          order.total ||
          order.product_total ||
          order.grand_total ||
          0
        );


      const items =
        order.items ||
        order.order_items ||
        [];


      const notes =
        order.customer_notes ||
        order.notes ||
        "Delivery charges will be confirmed according to the delivery location on WhatsApp.";


      const statusClass =
        "status-" +
        escapeHtml(status);


      const itemRows =
        items.length
          ? items
              .map(
                item =>
                  renderItemRow(item)
              )
              .join("")
          : `
            <tr>
              <td colspan="5">
                Product details unavailable.
              </td>
            </tr>
          `;


      return `

        <article class="order-card">

          <div class="order-header">

            <div>

              <div class="order-number">
                Order #${escapeHtml(orderId)}
              </div>

              <div class="order-date">
                ${formatDate(createdAt)}
              </div>

            </div>

            <div class="status-pill ${statusClass}">
              ${escapeHtml(
                statusLabel(status)
              )}
            </div>

          </div>


          <div class="order-body">


            <div class="order-grid">


              <div class="info-section">

                <h3>Customer</h3>

                <div class="info-line">
                  <strong>Name:</strong>
                  ${escapeHtml(customerName)}
                </div>

                <div class="info-line">
                  <strong>Phone:</strong>
                  ${escapeHtml(phone)}
                </div>

                <div class="info-line">
                  <strong>Email:</strong>
                  ${escapeHtml(email)}
                </div>

              </div>


              <div class="info-section">

                <h3>Payment</h3>

                <div class="info-line">
                  <strong>Method:</strong>
                  ${escapeHtml(
                    String(paymentMethod).toUpperCase()
                  )}
                </div>

                <div class="info-line">
                  <strong>Status:</strong>
                  ${escapeHtml(
                    String(paymentStatus)
                  )}
                </div>

              </div>


              <div class="info-section">

                <h3>Delivery Address</h3>

                <div class="address-box">
                  ${escapeHtml(address)}
                </div>

              </div>


              <div class="info-section">

                <h3>Order Notes</h3>

                <div class="address-box">
                  ${escapeHtml(notes)}
                </div>

              </div>


            </div>


            <div class="items-section">

              <div class="info-section">

                <h3>Products</h3>

              </div>


              <div class="items-table-wrapper">

                <table class="items-table">

                  <thead>

                    <tr>
                      <th>Product</th>
                      <th>Qty</th>
                      <th>Unit Price</th>
                      <th>Line Total</th>
                    </tr>

                  </thead>

                  <tbody>

                    ${itemRows}

                  </tbody>

                </table>

              </div>


              <div class="total-row">

                <div class="total-box">

                  <div class="total-line">

                    <span>Product Total</span>

                    <strong>
                      ${formatCurrency(total)}
                    </strong>

                  </div>


                  <div class="total-line">

                    <span>Delivery</span>

                    <strong>
                      To be confirmed
                    </strong>

                  </div>


                  <div class="total-line grand-total">

                    <span>Order Value</span>

                    <strong>
                      ${formatCurrency(total)}
                    </strong>

                  </div>

                </div>

              </div>


              <div class="delivery-note">

                Delivery charges are not calculated automatically.
                Confirm the delivery charge according to the
                customer's location on WhatsApp before finalizing
                the order.

              </div>


            </div>


            <div class="order-actions">

              <div class="status-control">

                <label for="status-${escapeHtml(orderId)}">
                  Update status
                </label>

                <select
                  id="status-${escapeHtml(orderId)}"
                  data-order-id="${escapeHtml(orderId)}"
                >

                  <option
                    value="new"
                    ${status === "new" ? "selected" : ""}
                  >
                    New
                  </option>

                  <option
                    value="confirmed"
                    ${status === "confirmed" ? "selected" : ""}
                  >
                    Confirmed
                  </option>

                  <option
                    value="preparing"
                    ${status === "preparing" ? "selected" : ""}
                  >
                    Preparing
                  </option>

                  <option
                    value="shipped"
                    ${status === "shipped" ? "selected" : ""}
                  >
                    Shipped
                  </option>

                  <option
                    value="delivered"
                    ${status === "delivered" ? "selected" : ""}
                  >
                    Delivered
                  </option>

                  <option
                    value="cancelled"
                    ${status === "cancelled" ? "selected" : ""}
                  >
                    Cancelled
                  </option>

                </select>

              </div>


              <button
                type="button"
                class="update-btn"
                onclick="updateOrderStatus('${escapeJs(orderId)}')"
              >
                Update Status
              </button>

            </div>


          </div>

        </article>

      `;

    }


    /* =========================================================
       RENDER ITEM
    ========================================================== */

    function renderItemRow(item) {

      const name =
        item.product_name ||
        item.name ||
        "Product";


      const quantity =
        Number(
          item.quantity ||
          item.qty ||
          0
        );


      const unitPrice =
        Number(
          item.unit_price ||
          item.price ||
          0
        );


      const lineTotal =
        Number(
          item.line_total ||
          item.total ||
          (quantity * unitPrice)
        );


      return `

        <tr>

          <td>
            ${escapeHtml(name)}
          </td>

          <td>
            ${quantity}
          </td>

          <td>
            ${formatCurrency(unitPrice)}
          </td>

          <td>
            ${formatCurrency(lineTotal)}
          </td>

        </tr>

      `;

    }


    /* =========================================================
       ESCAPE FOR INLINE JS
    ========================================================== */

    function escapeJs(value) {

      return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"');

    }


    /* =========================================================
       UPDATE ORDER STATUS
    ========================================================== */

    async function updateOrderStatus(orderId) {

      const select =
        document.querySelector(
          `select[data-order-id="${CSS.escape(String(orderId))}"]`
        );


      if (!select) {

        showDashboardMessage(
          "Status control could not be found."
        );

        return;
      }


      const newStatus =
        select.value;


      const button =
        select
          .closest(".order-actions")
          ?.querySelector(".update-btn");


      if (button) {

        button.disabled = true;
        button.textContent = "Updating...";

      }


      try {

        /*
          Primary API:
            PATCH /admin/orders/:id
        */

        let response =
          await fetch(
            WORKER_URL +
            "/admin/orders/" +
            encodeURIComponent(orderId),
            {
              method: "PATCH",

              headers: {
                "Content-Type": "application/json",
                "X-Admin-Key": adminKey
              },

              body: JSON.stringify({
                order_status: newStatus
              })
            }
          );


        let data =
          await response.json()
            .catch(() => ({}));


        /*
          Fallback for older Worker versions:
            POST /admin/update-status
        */

        if (!response.ok) {

          response =
            await fetch(
              WORKER_URL +
              "/admin/update-status",
              {
                method: "POST",

                headers: {
                  "Content-Type": "application/json",
                  "X-Admin-Key": adminKey
                },

                body: JSON.stringify({
                  order_id: orderId,
                  status: newStatus
                })
              }
            );


          data =
            await response.json()
              .catch(() => ({}));

        }


        /*
          If the old D1 schema uses "processing"
          instead of "preparing", the Worker should
          handle that internally.
        */

        if (!response.ok) {

          throw new Error(
            data.message ||
            data.error ||
            "Could not update order status."
          );

        }


        showDashboardMessage(
          "Order #" +
          orderId +
          " updated to " +
          statusLabel(newStatus) +
          ".",
          "success"
        );


        await loadOrders();


      } catch (error) {

        console.error(
          "Update status error:",
          error
        );


        showDashboardMessage(
          error.message ||
          "Unable to update order status."
        );


      } finally {

        if (button) {

          button.disabled = false;
          button.textContent = "Update Status";

        }

      }

    }


    /* =========================================================
       AUTO REFRESH
    ========================================================== */

    function startAutoRefresh() {

      stopAutoRefresh();


      refreshTimer =
        setInterval(
          () => {

            if (adminKey) {
              loadOrders();
            }

          },
          30000
        );

    }


    function stopAutoRefresh() {

      if (refreshTimer) {

        clearInterval(
          refreshTimer
        );

        refreshTimer = null;

      }

    }


    /* =========================================================
       ENTER KEY LOGIN
    ========================================================== */

    $("adminKey").addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          login();

        }

      }
    );


    /* =========================================================
       START
    ========================================================== */

    restoreSession();

  </script>

</body>
</html>
