<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aradhya | Order Admin</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #0b0b0b;
        color: #f5f5f5;
        min-height: 100vh;
    }

    :root {
        --gold: #c9a45c;
        --gold-light: #e1c47a;
        --black: #0b0b0b;
        --card: #151515;
        --border: rgba(201,164,92,0.35);
        --muted: #aaa;
    }

    button,
    input,
    select {
        font: inherit;
    }

    /* LOGIN */

    .login-screen {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        background:
            radial-gradient(circle at center, rgba(201,164,92,0.08), transparent 45%),
            #0b0b0b;
    }

    .login-box {
        width: 100%;
        max-width: 430px;
        background: #121212;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 35px;
        box-shadow: 0 15px 60px rgba(0,0,0,0.5);
    }

    .login-logo {
        text-align: center;
        margin-bottom: 25px;
    }

    .login-logo h1 {
        color: var(--gold);
        letter-spacing: 4px;
        font-size: 30px;
        margin-bottom: 8px;
    }

    .login-logo p {
        color: var(--muted);
        font-size: 13px;
    }

    .field {
        margin-bottom: 18px;
    }

    .field label {
        display: block;
        color: #ddd;
        font-size: 13px;
        margin-bottom: 8px;
    }

    .field input,
    .field select {
        width: 100%;
        padding: 13px 14px;
        background: #080808;
        border: 1px solid #333;
        border-radius: 8px;
        color: white;
        outline: none;
    }

    .field input:focus,
    .field select:focus {
        border-color: var(--gold);
    }

    .btn {
        border: 0;
        border-radius: 8px;
        padding: 12px 18px;
        cursor: pointer;
        transition: 0.2s;
    }

    .btn-gold {
        width: 100%;
        background: var(--gold);
        color: #111;
        font-weight: bold;
    }

    .btn-gold:hover {
        background: var(--gold-light);
    }

    .login-error {
        display: none;
        margin-top: 15px;
        padding: 11px;
        border-radius: 7px;
        background: rgba(180,40,40,0.15);
        border: 1px solid rgba(220,70,70,0.4);
        color: #ff8e8e;
        font-size: 13px;
        line-height: 1.5;
    }

    /* APP */

    .app {
        display: none;
        min-height: 100vh;
    }

    header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(11,11,11,0.97);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(10px);
    }

    .header-inner {
        max-width: 1400px;
        margin: auto;
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
    }

    .brand h1 {
        color: var(--gold);
        font-size: 23px;
        letter-spacing: 3px;
    }

    .brand span {
        display: block;
        color: #888;
        font-size: 11px;
        margin-top: 4px;
    }

    .header-actions {
        display: flex;
        gap: 8px;
    }

    .small-btn {
        background: #171717;
        color: #ddd;
        border: 1px solid #333;
        padding: 9px 13px;
        border-radius: 7px;
        cursor: pointer;
    }

    .small-btn:hover {
        border-color: var(--gold);
        color: var(--gold);
    }

    .logout-btn {
        color: #ff9999;
    }

    main {
        max-width: 1400px;
        margin: auto;
        padding: 25px 20px 60px;
    }

    /* STATS */

    .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin-bottom: 25px;
    }

    .stat {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px;
    }

    .stat-label {
        color: #999;
        font-size: 12px;
        margin-bottom: 8px;
    }

    .stat-value {
        color: var(--gold);
        font-size: 25px;
        font-weight: bold;
    }

    /* FILTERS */

    .filters {
        display: grid;
        grid-template-columns: 1fr 180px 180px auto;
        gap: 10px;
        margin-bottom: 20px;
    }

    .filters input,
    .filters select {
        width: 100%;
        background: #141414;
        border: 1px solid #333;
        color: white;
        padding: 12px;
        border-radius: 8px;
        outline: none;
    }

    .filters input:focus,
    .filters select:focus {
        border-color: var(--gold);
    }

    .refresh {
        background: var(--gold);
        color: #111;
        border: 0;
        font-weight: bold;
        padding: 12px 20px;
        border-radius: 8px;
        cursor: pointer;
    }

    /* MESSAGE */

    .message {
        display: none;
        margin-bottom: 18px;
        padding: 13px 15px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.5;
    }

    .message.error {
        display: block;
        background: rgba(190,40,40,0.12);
        border: 1px solid rgba(220,70,70,0.35);
        color: #ff9999;
    }

    .message.success {
        display: block;
        background: rgba(50,150,80,0.12);
        border: 1px solid rgba(80,190,100,0.3);
        color: #9be0aa;
    }

    /* ORDERS */

    .orders {
        display: grid;
        gap: 15px;
    }

    .order-card {
        background: var(--card);
        border: 1px solid #292929;
        border-radius: 13px;
        overflow: hidden;
    }

    .order-card:hover {
        border-color: rgba(201,164,92,0.4);
    }

    .order-top {
        padding: 17px;
        display: flex;
        justify-content: space-between;
        gap: 15px;
        align-items: flex-start;
        border-bottom: 1px solid #282828;
    }

    .order-id {
        color: var(--gold);
        font-weight: bold;
        font-size: 16px;
    }

    .order-date {
        color: #888;
        font-size: 12px;
        margin-top: 5px;
    }

    .badges {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        justify-content: flex-end;
    }

    .badge {
        display: inline-block;
        padding: 6px 9px;
        border-radius: 20px;
        font-size: 11px;
        border: 1px solid #444;
        background: #1c1c1c;
        color: #ddd;
        text-transform: capitalize;
    }

    .badge.new {
        color: #ffd27a;
        border-color: #8c6b2f;
    }

    .badge.confirmed {
        color: #8fc8ff;
        border-color: #39698e;
    }

    .badge.processing {
        color: #d8b6ff;
        border-color: #76519c;
    }

    .badge.shipped {
        color: #7ee5df;
        border-color: #347d79;
    }

    .badge.delivered {
        color: #91df9c;
        border-color: #367642;
    }

    .badge.cancelled {
        color: #ff8585;
        border-color: #873b3b;
    }

    .order-body {
        padding: 17px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .section-title {
        color: var(--gold);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 9px;
    }

    .customer-info {
        color: #ddd;
        font-size: 13px;
        line-height: 1.7;
        word-break: break-word;
    }

    .customer-info strong {
        color: white;
    }

    .items {
        display: grid;
        gap: 8px;
    }

    .item {
        background: #101010;
        border: 1px solid #262626;
        border-radius: 7px;
        padding: 9px 10px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 12px;
    }

    .item-name {
        color: #ddd;
    }

    .item-price {
        color: var(--gold);
        white-space: nowrap;
    }

    .order-bottom {
        padding: 15px 17px;
        background: #101010;
        border-top: 1px solid #292929;
        display: flex;
        justify-content: space-between;
        gap: 15px;
        align-items: center;
    }

    .total {
        color: white;
        font-size: 17px;
        font-weight: bold;
    }

    .total span {
        color: var(--gold);
    }

    .controls {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
    }

    .controls select {
        background: #181818;
        border: 1px solid #444;
        color: white;
        border-radius: 7px;
        padding: 9px;
        min-width: 145px;
        outline: none;
    }

    .update-btn {
        background: var(--gold);
        color: #111;
        border: 0;
        border-radius: 7px;
        padding: 9px 13px;
        font-weight: bold;
        cursor: pointer;
    }

    .update-btn:hover {
        background: var(--gold-light);
    }

    .empty {
        text-align: center;
        padding: 50px 20px;
        background: var(--card);
        border: 1px solid #292929;
        border-radius: 12px;
        color: #888;
    }

    .loading {
        text-align: center;
        padding: 50px;
        color: var(--gold);
    }

    /* RESPONSIVE */

    @media (max-width: 900px) {
        .stats {
            grid-template-columns: repeat(2, 1fr);
        }

        .filters {
            grid-template-columns: 1fr 1fr;
        }

        .filters input {
            grid-column: 1 / -1;
        }

        .order-body {
            grid-template-columns: 1fr;
        }
    }

    @media (max-width: 600px) {
        .header-inner {
            align-items: flex-start;
        }

        .header-actions {
            flex-direction: column;
        }

        .stats {
            grid-template-columns: 1fr 1fr;
        }

        .filters {
            grid-template-columns: 1fr;
        }

        .filters input {
            grid-column: auto;
        }

        .order-top {
            flex-direction: column;
        }

        .badges {
            justify-content: flex-start;
        }

        .order-bottom {
            flex-direction: column;
            align-items: stretch;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr;
        }

        .controls select,
        .update-btn {
            width: 100%;
        }

        main {
            padding: 18px 12px 40px;
        }

        .login-box {
            padding: 25px 20px;
        }
    }
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="login-screen">

    <div class="login-box">

        <div class="login-logo">
            <h1>ARADHYA</h1>
            <p>Order Management Dashboard</p>
        </div>

        <div class="field">
            <label for="adminKey">Admin Key</label>
            <input
                type="password"
                id="adminKey"
                placeholder="Enter admin key"
                autocomplete="current-password"
            >
        </div>

        <button class="btn btn-gold" id="loginBtn">
            Login
        </button>

        <div id="loginError" class="login-error"></div>

    </div>

</div>


<!-- ADMIN APP -->

<div id="app" class="app">

    <header>

        <div class="header-inner">

            <div class="brand">
                <h1>ARADHYA</h1>
                <span>Order Management Dashboard</span>
            </div>

            <div class="header-actions">

                <button class="small-btn" id="refreshTopBtn">
                    ↻ Refresh
                </button>

                <button class="small-btn logout-btn" id="logoutBtn">
                    Logout
                </button>

            </div>

        </div>

    </header>


    <main>

        <!-- STATS -->

        <div class="stats">

            <div class="stat">
                <div class="stat-label">Total Orders</div>
                <div class="stat-value" id="totalOrders">0</div>
            </div>

            <div class="stat">
                <div class="stat-label">New Orders</div>
                <div class="stat-value" id="newOrders">0</div>
            </div>

            <div class="stat">
                <div class="stat-label">Delivered</div>
                <div class="stat-value" id="deliveredOrders">0</div>
            </div>

            <div class="stat">
                <div class="stat-label">Order Value</div>
                <div class="stat-value" id="totalValue">₹0</div>
            </div>

        </div>


        <!-- MESSAGE -->

        <div id="message" class="message"></div>


        <!-- FILTERS -->

        <div class="filters">

            <input
                type="search"
                id="searchInput"
                placeholder="Search by order ID, name, phone or email..."
            >

            <select id="statusFilter">

                <option value="">All Order Status</option>
                <option value="new">New</option>
                <option value="confirmed">Confirmed</option>
                <option value="processing">Processing</option>
                <option value="shipped">Shipped</option>
                <option value="delivered">Delivered</option>
                <option value="cancelled">Cancelled</option>

            </select>

            <select id="paymentFilter">

                <option value="">All Payment Status</option>
                <option value="pending">Pending</option>
                <option value="cod">COD</option>
                <option value="paid">Paid</option>
                <option value="failed">Failed</option>
                <option value="refunded">Refunded</option>

            </select>

            <button class="refresh" id="refreshBtn">
                Refresh Orders
            </button>

        </div>


        <!-- ORDERS -->

        <div id="orders" class="orders">

            <div class="loading">
                Loading orders...
            </div>

        </div>

    </main>

</div>


<script>

/* =========================================================
   ARADHYA ADMIN CONFIGURATION
========================================================= */

const API_BASE =
    "https://aradhyabackend.www-aradhya-co.workers.dev";


/* =========================================================
   STATE
========================================================= */

let adminKey = "";
let allOrders = [];


/* =========================================================
   ELEMENTS
========================================================= */

const loginScreen =
    document.getElementById("loginScreen");

const app =
    document.getElementById("app");

const adminKeyInput =
    document.getElementById("adminKey");

const loginBtn =
    document.getElementById("loginBtn");

const loginError =
    document.getElementById("loginError");

const logoutBtn =
    document.getElementById("logoutBtn");

const refreshBtn =
    document.getElementById("refreshBtn");

const refreshTopBtn =
    document.getElementById("refreshTopBtn");

const ordersContainer =
    document.getElementById("orders");

const searchInput =
    document.getElementById("searchInput");

const statusFilter =
    document.getElementById("statusFilter");

const paymentFilter =
    document.getElementById("paymentFilter");

const messageBox =
    document.getElementById("message");


/* =========================================================
   LOGIN
========================================================= */

loginBtn.addEventListener("click", login);

adminKeyInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        login();
    }

});


async function login() {

    const key =
        adminKeyInput.value.trim();

    if (!key) {

        showLoginError(
            "Please enter your admin key."
        );

        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Checking...";

    try {

        /*
         * We test the admin endpoint.
         * The backend accepts:
         * X-Admin-Key
         * and Authorization: Bearer
         */

        const response =
            await fetch(
                API_BASE + "/admin/orders",
                {
                    method: "GET",

                    headers: {
                        "X-Admin-Key": key,
                        "Authorization": "Bearer " + key
                    }
                }
            );


        const data =
            await response.json().catch(
                () => ({})
            );


        if (!response.ok) {

            let errorText =
                data.error ||
                data.message ||
                "Admin login failed.";

            if (data.debug) {
                errorText +=
                    "\n\nBackend debug:\n" +
                    data.debug;
            }

            throw new Error(errorText);
        }


        adminKey = key;

        sessionStorage.setItem(
            "aradhya_admin_key",
            key
        );


        loginScreen.style.display = "none";
        app.style.display = "block";

        hideLoginError();

        /*
         * The response already contains orders,
         * so render them immediately.
         */

        allOrders =
            Array.isArray(data.orders)
                ? data.orders
                : [];

        updateDashboard();
        renderOrders();


        /*
         * Load fresh orders once more.
         */

        await loadOrders();


    } catch (error) {

        showLoginError(
            error.message ||
            "Unable to connect to the backend."
        );

    } finally {

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";

    }

}


/* =========================================================
   LOAD ORDERS
========================================================= */

async function loadOrders() {

    if (!adminKey) {
        return;
    }

    ordersContainer.innerHTML =
        '<div class="loading">Loading orders...</div>';

    hideMessage();


    try {

        const response =
            await fetch(
                API_BASE + "/admin/orders",
                {
                    method: "GET",

                    headers: {
                        "X-Admin-Key": adminKey,
                        "Authorization": "Bearer " + adminKey,
                        "Accept": "application/json"
                    }
                }
            );


        const rawText =
            await response.text();

        let data = {};

        try {
            data = JSON.parse(rawText);
        } catch (e) {
            throw new Error(
                "Backend returned an invalid response."
            );
        }


        if (!response.ok) {

            let errorText =
                data.error ||
                data.message ||
                "Could not load orders.";

            /*
             * IMPORTANT:
             * Show backend debug information if the
             * Worker sends it.
             */

            if (data.debug) {
                errorText +=
                    "\n\nDebug:\n" +
                    data.debug;
            }

            throw new Error(errorText);
        }


        allOrders =
            Array.isArray(data.orders)
                ? data.orders
                : [];


        updateDashboard();
        renderOrders();


    } catch (error) {

        ordersContainer.innerHTML = "";

        showMessage(
            error.message ||
            "Could not load orders.",
            "error"
        );

        /*
         * Also show an error card so it is impossible
         * to miss the backend problem.
         */

        ordersContainer.innerHTML = `
            <div class="empty">

                <h3 style="color:#ff9999;margin-bottom:12px;">
                    Could not load orders
                </h3>

                <div style="
                    color:#aaa;
                    white-space:pre-wrap;
                    line-height:1.6;
                ">
                    ${escapeHtml(
                        error.message ||
                        "Unknown backend error."
                    )}
                </div>

            </div>
        `;

    }

}


/* =========================================================
   UPDATE DASHBOARD
========================================================= */

function updateDashboard() {

    const orders =
        Array.isArray(allOrders)
            ? allOrders
            : [];


    document.getElementById("totalOrders")
        .textContent = orders.length;


    const newCount =
        orders.filter(
            o => o.order_status === "new"
        ).length;

    document.getElementById("newOrders")
        .textContent = newCount;


    const deliveredCount =
        orders.filter(
            o => o.order_status === "delivered"
        ).length;

    document.getElementById("deliveredOrders")
        .textContent = deliveredCount;


    const total =
        orders.reduce(
            (sum, order) =>
                sum + Number(order.total || 0),
            0
        );


    document.getElementById("totalValue")
        .textContent =
            "₹" + total.toLocaleString("en-IN");

}


/* =========================================================
   FILTERING
========================================================= */

searchInput.addEventListener(
    "input",
    renderOrders
);

statusFilter.addEventListener(
    "change",
    renderOrders
);

paymentFilter.addEventListener(
    "change",
    renderOrders
);


function getFilteredOrders() {

    const search =
        searchInput.value
            .trim()
            .toLowerCase();

    const status =
        statusFilter.value;

    const payment =
        paymentFilter.value;


    return allOrders.filter(order => {

        const searchable = [

            order.order_id,

            order.customer_name,

            order.customer_phone,

            order.customer_email,

            order.customer_address

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


        const matchesSearch =
            !search ||
            searchable.includes(search);


        const matchesStatus =
            !status ||
            order.order_status === status;


        const matchesPayment =
            !payment ||
            order.payment_status === payment;


        return (
            matchesSearch &&
            matchesStatus &&
            matchesPayment
        );

    });

}


/* =========================================================
   RENDER ORDERS
========================================================= */

function renderOrders() {

    const orders =
        getFilteredOrders();


    if (!orders.length) {

        ordersContainer.innerHTML = `
            <div class="empty">
                No orders found.
            </div>
        `;

        return;
    }


    ordersContainer.innerHTML =
        orders.map(
            order => renderOrder(order)
        ).join("");

}


/* =========================================================
   RENDER SINGLE ORDER
========================================================= */

function renderOrder(order) {

    const status =
        order.order_status || "new";

    const payment =
        order.payment_status || "pending";


    const items =
        Array.isArray(order.items)
            ? order.items
            : [];


    const created =
        formatDate(order.created_at);


    const itemsHtml =
        items.length
            ? items.map(item => `

                <div class="item">

                    <div class="item-name">

                        <strong>
                            ${escapeHtml(
                                item.product_name ||
                                "Product"
                            )}
                        </strong>

                        × ${Number(
                            item.quantity || 0
                        )}

                    </div>

                    <div class="item-price">

                        ₹${Number(
                            item.line_total ||
                            (
                                Number(item.unit_price || 0) *
                                Number(item.quantity || 0)
                            )
                        ).toLocaleString("en-IN")}

                    </div>

                </div>

            `).join("")
            : `
                <div style="color:#777;">
                    No item information available.
                </div>
            `;


    return `

        <div class="order-card">

            <div class="order-top">

                <div>

                    <div class="order-id">
                        #${escapeHtml(
                            order.order_id || "Unknown"
                        )}
                    </div>

                    <div class="order-date">
                        ${escapeHtml(created)}
                    </div>

                </div>


                <div class="badges">

                    <span class="badge ${escapeHtml(status)}">
                        Order: ${escapeHtml(status)}
                    </span>

                    <span class="badge">
                        Payment: ${escapeHtml(payment)}
                    </span>

                </div>

            </div>


            <div class="order-body">

                <!-- CUSTOMER -->

                <div>

                    <div class="section-title">
                        Customer
                    </div>

                    <div class="customer-info">

                        <div>
                            <strong>Name:</strong>
                            ${escapeHtml(
                                order.customer_name || "-"
                            )}
                        </div>

                        <div>
                            <strong>Phone:</strong>
                            ${escapeHtml(
                                order.customer_phone || "-"
                            )}
                        </div>

                        <div>
                            <strong>Email:</strong>
                            ${escapeHtml(
                                order.customer_email || "-"
                            )}
                        </div>

                        <div>
                            <strong>Address:</strong><br>
                            ${escapeHtml(
                                order.customer_address || "-"
                            ).replace(/\n/g, "<br>")}
                        </div>

                        ${
                            order.customer_notes
                            ? `
                                <div style="margin-top:8px;">
                                    <strong>Notes:</strong><br>
                                    ${escapeHtml(
                                        order.customer_notes
                                    )}
                                </div>
                            `
                            : ""
                        }

                    </div>

                </div>


                <!-- PRODUCTS -->

                <div>

                    <div class="section-title">
                        Products
                    </div>

                    <div class="items">

                        ${itemsHtml}

                    </div>

                </div>

            </div>


            <div class="order-bottom">

                <div class="total">

                    Product Total:
                    <span>
                        ₹${Number(
                            order.total || 0
                        ).toLocaleString("en-IN")}
                    </span>

                </div>


                <div class="controls">

                    <select
                        id="status-${escapeHtml(
                            order.order_id
                        )}"
                    >

                        ${statusOption(
                            "new",
                            status
                        )}

                        ${statusOption(
                            "confirmed",
                            status
                        )}

                        ${statusOption(
                            "processing",
                            status
                        )}

                        ${statusOption(
                            "shipped",
                            status
                        )}

                        ${statusOption(
                            "delivered",
                            status
                        )}

                        ${statusOption(
                            "cancelled",
                            status
                        )}

                    </select>


                    <select
                        id="payment-${escapeHtml(
                            order.order_id
                        )}"
                    >

                        ${paymentOption(
                            "pending",
                            payment
                        )}

                        ${paymentOption(
                            "cod",
                            payment
                        )}

                        ${paymentOption(
                            "paid",
                            payment
                        )}

                        ${paymentOption(
                            "failed",
                            payment
                        )}

                        ${paymentOption(
                            "refunded",
                            payment
                        )}

                    </select>


                    <button
                        class="update-btn"
                        onclick="updateOrder(
                            '${jsEscape(order.order_id)}'
                        )"
                    >
                        Update
                    </button>

                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   STATUS OPTIONS
========================================================= */

function statusOption(value, selected) {

    return `
        <option
            value="${value}"
            ${value === selected ? "selected" : ""}
        >
            ${capitalize(value)}
        </option>
    `;

}


function paymentOption(value, selected) {

    return `
        <option
            value="${value}"
            ${value === selected ? "selected" : ""}
        >
            ${capitalize(value)}
        </option>
    `;

}


/* =========================================================
   UPDATE ORDER
========================================================= */

async function updateOrder(orderId) {

    if (!adminKey) {
        return;
    }


    const statusElement =
        document.getElementById(
            "status-" + orderId
        );

    const paymentElement =
        document.getElementById(
            "payment-" + orderId
        );


    if (!statusElement || !paymentElement) {
        return;
    }


    const orderStatus =
        statusElement.value;

    const paymentStatus =
        paymentElement.value;


    try {

        showMessage(
            "Updating order " + orderId + "...",
            "success"
        );


        const response =
            await fetch(
                API_BASE +
                "/admin/orders/" +
                encodeURIComponent(orderId),
                {
                    method: "PATCH",

                    headers: {
                        "Content-Type": "application/json",
                        "X-Admin-Key": adminKey,
                        "Authorization": "Bearer " + adminKey
                    },

                    body: JSON.stringify({

                        order_status:
                            orderStatus,

                        payment_status:
                            paymentStatus

                    })
                }
            );


        const rawText =
            await response.text();

        let data = {};

        try {
            data = JSON.parse(rawText);
        } catch (e) {
            data = {};
        }


        if (!response.ok) {

            let errorText =
                data.error ||
                data.message ||
                "Could not update order.";

            if (data.debug) {
                errorText +=
                    "\n\nDebug:\n" +
                    data.debug;
            }

            throw new Error(errorText);
        }


        showMessage(
            "Order " +
            orderId +
            " updated successfully.",
            "success"
        );


        await loadOrders();


    } catch (error) {

        showMessage(
            error.message ||
            "Could not update order.",
            "error"
        );

    }

}


/* =========================================================
   REFRESH
========================================================= */

refreshBtn.addEventListener(
    "click",
    loadOrders
);

refreshTopBtn.addEventListener(
    "click",

);


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener(

        adminKey = "";

        sessionStorage.removeItem(
            "aradhya_admin_key"
        );

        allOrders = [];

        app.style.display = "none";

        adminKeyInput.value = "";

        hideMessage();

    }
);


/* =========================================================
   AUTO LOGIN FROM SESSION
========================================================= */

window.addEventListener(
    "DOMContentLoaded",
    async function() {

        const savedKey =
            sessionStorage.getItem(
                "aradhya_admin_key"
            );


        if (!savedKey) {
            return;
        }


        adminKey = savedKey;

        loginScreen.style.display = "none";
        app.style.display = "block";

        await loadOrders();

    }
);


/* =========================================================
   HELPERS
========================================================= */

function capitalize(value) {

    if (!value) {
        return "";
    }

    return value.charAt(0).toUpperCase() +
           value.slice(1);

}


function formatDate(value) {

    if (!value) {
        return "Date unavailable";
    }

    try {

        const date =
            new Date(value);

        if (isNaN(date.getTime())) {
            return value;
        }

        return date.toLocaleString(
            "en-IN",
            {
                dateStyle: "medium",
                timeStyle: "short"
            }
        );

    } catch (e) {

        return value;

    }

}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function jsEscape(value) {

    return String(value ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/\r/g, "\\r")
        .replace(/\n/g, "\\n");

}


/* =========================================================
   MESSAGES
========================================================= */

function showMessage(text, type) {

    messageBox.className =
        "message " + type;

    messageBox.textContent =
        text;

}


function hideMessage() {

    messageBox.className =
        "message";

    messageBox.textContent =
        "";

}


function showLoginError(text) {

    loginError.style.display =
        "block";

    loginError.textContent =
        text;

}


function hideLoginError() {

    loginError.style.display =
        "none";

    loginError.textContent =
        "";

}
