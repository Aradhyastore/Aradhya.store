<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Krunchiez Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    header {
      background: #ffd21c;
      color: #111;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 6px 0 0;
      font-weight: bold;
    }

    .container {
      width: 94%;
      max-width: 1300px;
      margin: auto;
      padding: 25px 0 50px;
    }

    /* LOGIN */

    .login-box {
      max-width: 450px;
      margin: 70px auto;
      background: #222;
      padding: 30px;
      border-radius: 18px;
      text-align: center;
    }

    .login-box h2 {
      margin-top: 0;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 9px;
      border: 1px solid #555;
      background: #111;
      color: #fff;
      outline: none;
    }

    button {
      border: none;
      background: #ffd21c;
      color: #111;
      padding: 11px 17px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .error {
      color: #ff7777;
      margin-top: 12px;
    }

    .hidden {
      display: none !important;
    }

    /* TOP BAR */

    .dashboard-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .dashboard-top h2 {
      margin: 0;
    }

    .top-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .logout-btn {
      background: #333;
      color: #fff;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: #222;
      padding: 20px;
      border-radius: 15px;
      border-left: 5px solid #ffd21c;
    }

    .stat-title {
      color: #aaa;
      font-size: 14px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: bold;
      margin-top: 8px;
    }

    /* FILTERS */

    .filters {
      background: #222;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .filters-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 12px;
    }

    .refresh-info {
      color: #aaa;
      font-size: 13px;
      margin-top: 10px;
    }

    /* ORDERS */

    .orders {
      display: grid;
      gap: 15px;
    }

    .order {
      background: #222;
      border-radius: 15px;
      border-left: 5px solid #ffd21c;
      overflow: hidden;
    }

    .order-summary {
      padding: 18px;
      cursor: pointer;
    }

    .order-summary:hover {
      background: #292929;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .order-id {
      color: #ffd21c;
      font-size: 19px;
      font-weight: bold;
    }

    .order-time {
      color: #aaa;
      font-size: 13px;
    }

    .badges {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .badge {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 7px;
      background: #333;
      font-size: 12px;
      font-weight: bold;
    }

    .details {
      display: none;
      padding: 0 18px 20px;
      border-top: 1px solid #333;
    }

    .details.open {
      display: block;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .detail-box {
      background: #171717;
      padding: 13px;
      border-radius: 9px;
    }

    .detail-label {
      color: #999;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .detail-value {
      word-break: break-word;
    }

    .items-box {
      margin-top: 15px;
      background: #171717;
      padding: 15px;
      border-radius: 10px;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 9px 0;
      border-bottom: 1px solid #333;
    }

    .item-row:last-child {
      border-bottom: none;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      color: #ffd21c;
      margin-top: 15px;
    }

    .management {
      margin-top: 18px;
      padding: 15px;
      background: #171717;
      border-radius: 10px;
    }

    .management-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .management select {
      width: auto;
      min-width: 190px;
      margin: 0;
    }

    .save-status {
      color: #8cff8c;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      background: #222;
      border-radius: 15px;
      color: #aaa;
    }

    .last-updated {
      color: #aaa;
      font-size: 13px;
    }

    /* MOBILE */

    @media (max-width: 800px) {

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .filters-grid {
        grid-template-columns: 1fr;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 500px) {

      header h1 {
        font-size: 23px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .container {
        width: 92%;
      }

      .management select {
        width: 100%;
      }

      .management button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🍿 Krunchiez Admin</h1>
  <p>Orders Dashboard</p>
</header>

<div class="container">

  <!-- ========================= -->
  <!-- LOGIN -->
  <!-- ========================= -->

  <div id="loginBox" class="login-box">

    <h2>Admin Login 🔐</h2>

    <p>Enter your Admin Key to manage orders.</p>

    <input
      type="password"
      id="adminKey"
      placeholder="Enter Admin Key"
      autocomplete="off"
    >

    <button onclick="login()">
      Login
    </button>

    <div id="loginError" class="error"></div>

  </div>


  <!-- ========================= -->
  <!-- DASHBOARD -->
  <!-- ========================= -->

  <div id="dashboard" class="hidden">

    <div class="dashboard-top">

      <div>
        <h2>Orders</h2>

        <div class="last-updated">
          Last updated:
          <span id="lastUpdated">-</span>
        </div>
      </div>

      <div class="top-buttons">

        <button onclick="loadOrders(true)">
          🔄 Refresh
        </button>

        <button
          class="logout-btn"
          onclick="logout()"
        >
          Logout
        </button>

      </div>

    </div>


    <!-- ========================= -->
    <!-- STATS -->
    <!-- ========================= -->

    <div class="stats">

      <div class="stat">
        <div class="stat-title">
          Total Orders
        </div>

        <div
          class="stat-value"
          id="totalOrders"
        >
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          New Orders
        </div>

        <div
          class="stat-value"
          id="newOrders"
        >
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          Active Orders
        </div>

        <div
          class="stat-value"
          id="activeOrders"
        >
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          Order Value
        </div>

        <div
          class="stat-value"
          id="totalSales"
        >
          ₹0
        </div>
      </div>

    </div>


    <!-- ========================= -->
    <!-- FILTERS -->
    <!-- ========================= -->

    <div class="filters">

      <div class="filters-grid">

        <input
          type="text"
          id="searchInput"
          placeholder="🔎 Search order ID, name, phone or address..."
          oninput="applyFilters()"
        >


        <select
          id="statusFilter"
          onchange="applyFilters()"
        >
          <option value="all">
            All Order Status
          </option>

          <option value="new">
            New
          </option>

          <option value="confirmed">
            Confirmed
          </option>

          <option value="preparing">
            Preparing
          </option>

          <option value="shipped">
            Shipped
          </option>

          <option value="delivered">
            Delivered
          </option>

          <option value="cancelled">
            Cancelled
          </option>

        </select>


        <select
          id="paymentFilter"
          onchange="applyFilters()"
        >

          <option value="all">
            All Payment Status
          </option>

          <option value="pending">
            Pending
          </option>

          <option value="paid">
            Paid
          </option>

          <option value="failed">
            Failed
          </option>

          <option value="refunded">
            Refunded
          </option>

        </select>

      </div>


      <div class="refresh-info">
        Dashboard automatically refreshes every 30 seconds.
      </div>

    </div>


    <!-- ========================= -->
    <!-- ORDERS -->
    <!-- ========================= -->

    <div id="orders" class="orders"></div>

  </div>

</div>


<script>

const WORKER_URL =
  "https://aradhyabackend.www-aradhya-co.workers.dev";

let adminKey = "";
let allOrders = [];
let refreshTimer = null;


/* =========================
   LOGIN
========================= */

async function login() {

  const input =
    document.getElementById("adminKey");

  const error =
    document.getElementById("loginError");

  const key =
    input.value.trim();

  if (!key) {

    error.textContent =
      "Please enter your Admin Key.";

    return;
  }

  adminKey = key;

  error.textContent = "";

  await loadOrders(false, true);
}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(
  showMessage = false,
  firstLogin = false
) {

  if (!adminKey) {
    return;
  }

  try {

    const response =
      await fetch(
        WORKER_URL + "/admin/orders",
        {
          method: "GET",

          headers: {
            "X-Admin-Key": adminKey
          }
        }
      );


    const data =
      await response.json();


    if (
      response.status === 401 ||
      !data.success
    ) {

      if (firstLogin) {

        document.getElementById(
          "loginError"
        ).textContent =
          "Invalid Admin Key.";

      } else {

        alert(
          "Admin authentication failed. Please login again."
        );

        logout();

      }

      return;
    }


    allOrders =
      Array.isArray(data.orders)
        ? data.orders
        : [];


    document.getElementById(
      "loginBox"
    ).classList.add("hidden");


    document.getElementById(
      "dashboard"
    ).classList.remove("hidden");


    updateStats();

    applyFilters();

    document.getElementById(
      "lastUpdated"
    ).textContent =
      new Date().toLocaleString();


    if (showMessage) {

      // Small visual feedback
      const button =
        document.querySelector(
          ".top-buttons button"
        );

      if (button) {

        const original =
          button.textContent;

        button.textContent =
          "✅ Updated";

        setTimeout(() => {
          button.textContent =
            original;
        }, 1200);
      }
    }


    startAutoRefresh();

  } catch (error) {

    console.error(error);

    if (firstLogin) {

      document.getElementById(
        "loginError"
      ).textContent =
        "Could not connect to the Krunchiez server.";

    } else {

      alert(
        "Could not refresh orders."
      );
    }
  }
}


/* =========================
   AUTO REFRESH
========================= */

function startAutoRefresh() {

  if (refreshTimer) {
    return;
  }

  refreshTimer =
    setInterval(() => {

      if (adminKey) {
        loadOrders(false);
      }

    }, 30000);
}


/* =========================
   LOGOUT
========================= */

function logout() {

  adminKey = "";
  allOrders = [];

  if (refreshTimer) {

    clearInterval(refreshTimer);

    refreshTimer = null;
  }


  document.getElementById(
    "dashboard"
  ).classList.add("hidden");


  document.getElementById(
    "loginBox"
  ).classList.remove("hidden");


  document.getElementById(
    "adminKey"
  ).value = "";


  document.getElementById(
    "loginError"
  ).textContent = "";


  document.getElementById(
    "orders"
  ).innerHTML = "";
}


/* =========================
   STATS
========================= */

function updateStats() {

  const total =
    allOrders.length;


  const newCount =
    allOrders.filter(
      order =>
        order.order_status === "new"
    ).length;


  const activeCount =
    allOrders.filter(
      order =>
        ![
          "delivered",
          "cancelled"
        ].includes(order.order_status)
    ).length;


  const sales =
    allOrders.reduce(
      (sum, order) =>
        sum +
        Number(order.total || 0),
      0
    );


  document.getElementById(
    "totalOrders"
  ).textContent =
    total;


  document.getElementById(
    "newOrders"
  ).textContent =
    newCount;


  document.getElementById(
    "activeOrders"
  ).textContent =
    activeCount;


  document.getElementById(
    "totalSales"
  ).textContent =
    "₹" + sales;
}


/* =========================
   FILTERS
========================= */

function applyFilters() {

  const search =
    document.getElementById(
      "searchInput"
    ).value
      .trim()
      .toLowerCase();


  const status =
    document.getElementById(
      "statusFilter"
    ).value;


  const payment =
    document.getElementById(
      "paymentFilter"
    ).value;


  const filtered =
    allOrders.filter(order => {

      const searchable =
        [
          order.order_id,
          order.customer_name,
          order.customer_phone,
          order.customer_address
        ]
          .join(" ")
          .toLowerCase();


      const searchMatch =
        !search ||
        searchable.includes(search);


      const statusMatch =
        status === "all" ||
        order.order_status === status;


      const paymentMatch =
        payment === "all" ||
        order.payment_status === payment;


      return (
        searchMatch &&
        statusMatch &&
        paymentMatch
      );

    });


  displayOrders(filtered);
}


/* =========================
   DISPLAY ORDERS
========================= */

function displayOrders(orders) {

  const container =
    document.getElementById(
      "orders"
    );


  container.innerHTML = "";


  if (
    !orders ||
    orders.length === 0
  ) {

    container.innerHTML =
      `
      <div class="empty">
        <h3>No orders found 🍿</h3>
        <p>
          Try changing your search or filters.
        </p>
      </div>
      `;

    return;
  }


  orders.forEach(order => {

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "order";


    const summary =
      document.createElement(
        "div"
      );

    summary.className =
      "order-summary";


    const header =
      document.createElement(
        "div"
      );

    header.className =
      "order-header";


    const idBox =
      document.createElement(
        "div"
      );


    idBox.innerHTML =
      `
      <div class="order-id">
        ${escapeHTML(order.order_id)}
      </div>

      <div class="order-time">
        ${escapeHTML(formatDate(order.created_at))}
      </div>
      `;


    const badgeBox =
      document.createElement(
        "div"
      );

    badgeBox.className =
      "badges";


    const statusBadge =
      document.createElement(
        "span"
      );

    statusBadge.className =
      "badge";

    statusBadge.textContent =
      "Order: " +
      formatStatus(order.order_status);


    const paymentBadge =
      document.createElement(
        "span"
      );

    paymentBadge.className =
      "badge";

    paymentBadge.textContent =
      "Payment: " +
      formatStatus(order.payment_status);


    badgeBox.appendChild(
      statusBadge
    );

    badgeBox.appendChild(
      paymentBadge
    );


    header.appendChild(
      idBox
    );

    header.appendChild(
      badgeBox
    );


    summary.appendChild(
      header
    );


    const details =
      document.createElement(
        "div"
      );

    details.className =
      "details";


    details.innerHTML =
      buildOrderDetails(order);


    summary.addEventListener(
      "click",
      () => {

        details.classList.toggle(
          "open"
        );

      }
    );


    card.appendChild(
      summary
    );

    card.appendChild(
      details
    );


    container.appendChild(
      card
    );

  });
}


/* =========================
   ORDER DETAILS
========================= */

function buildOrderDetails(order) {

  let itemsHTML = "";

  try {

    const items =
      JSON.parse(
        order.items || "[]"
      );


    if (
      Array.isArray(items) &&
      items.length
    ) {

      items.forEach(item => {

        const name =
          item.name ||
          "Product";


        const quantity =
          Number(
            item.quantity || 1
          );


        const price =
          Number(
            (item.unit_price ?? item.price ?? 0)
          );


        const lineTotal =
          price * quantity;


        itemsHTML +=
          `
          <div class="item-row">

            <span>
              ${escapeHTML(name)}
              × ${quantity}
            </span>

            <span>
              ₹${lineTotal}
            </span>

          </div>
          `;

      });

    } else {

      itemsHTML =
        "<p>No item information.</p>";
    }

  } catch {

    itemsHTML =
      `
      <p>
        ${escapeHTML(order.items || "")}
      </p>
      `;
  }


  return `
    <div class="detail-grid">

      <div class="detail-box">

        <div class="detail-label">
          CUSTOMER
        </div>

        <div class="detail-value">
          ${escapeHTML(order.customer_name)}
        </div>

      </div>


      <div class="detail-box">

        <div class="detail-label">
          PHONE
        </div>

        <div class="detail-value">
          ${escapeHTML(order.customer_phone)}
        </div>

      </div>


      <div class="detail-box">

        <div class="detail-label">
          ADDRESS
        </div>

        <div class="detail-value">
          ${escapeHTML(order.customer_address)}
        </div>

      </div>


      <div class="detail-box">

        <div class="detail-label">
          ORDER ID
        </div>

        <div class="detail-value">
          ${escapeHTML(order.order_id)}
        </div>

      </div>

    </div>


    <div class="items-box">

      <strong>🍿 Ordered Items</strong>

      ${itemsHTML}

      <div class="total">
        Total: ₹${Number(order.total || 0)}
      </div>

    </div>


    <div class="management">

      <strong>
        Manage Order
      </strong>

      <div class="management-row">

        <select
          id="status-${escapeHTML(order.order_id)}"
          onchange="changeStatus(
            '${escapeJS(order.order_id)}',
            this.value,
            this
          )"
        >

          ${statusOptions(order.order_status)}

        </select>

        <span
          class="save-status"
          id="save-${escapeHTML(order.order_id)}"
        ></span>

      </div>

    </div>
  `;
}


/* =========================
   STATUS OPTIONS
========================= */

function statusOptions(current) {

  const statuses = [
    ["new", "New"],
    ["confirmed", "Confirmed"],
    ["preparing", "Preparing"],
    ["shipped", "Shipped"],
    ["delivered", "Delivered"],
    ["cancelled", "Cancelled"]
  ];


  return statuses
    .map(status => {

      return `
        <option
          value="${status[0]}"
          ${status[0] === (current === "processing" ? "preparing" : current) ? "selected" : ""}
        >
          ${status[1]}
        </option>
      `;

    })
    .join("");
}


/* =========================
   CHANGE STATUS
========================= */

async function changeStatus(
  orderId,
  newStatus,
  selectElement
) {

  if (!adminKey) {
    return;
  }


  const saveMessage =
    document.getElementById(
      "save-" + orderId
    );


  if (saveMessage) {

    saveMessage.textContent =
      "Saving...";
  }


  try {

    const response =
      await fetch(
        WORKER_URL +
        "/admin/update-status",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "X-Admin-Key":
              adminKey
          },

          body: JSON.stringify({
            order_id: orderId,
            status: newStatus
          })
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.message ||
        "Could not update status."
      );
    }


    // Update local order
    const order =
      allOrders.find(
        item =>
          item.order_id === orderId
      );


    if (order) {
      order.order_status =
        newStatus;
    }


    updateStats();

    applyFilters();


    if (saveMessage) {

      saveMessage.textContent =
        "✓ Saved";

      setTimeout(() => {

        if (saveMessage) {
          saveMessage.textContent =
            "";
        }

      }, 2000);
    }


  } catch (error) {

    console.error(error);

    alert(
      "Could not update order status."
    );

    // Restore previous data
    await loadOrders(false);
  }
}


/* =========================
   FORMAT STATUS
========================= */

function formatStatus(status) {

  if (!status) {
    return "Unknown";
  }


  return status
    .charAt(0)
    .toUpperCase() +
    status
      .slice(1)
      .replace(/_/g, " ");
}


/* =========================
   FORMAT DATE
========================= */

function formatDate(date) {

  if (!date) {
    return "Unknown time";
  }


  try {

    return new Date(
      date
    ).toLocaleString();

  } catch {

    return date;
  }
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* =========================
   ESCAPE JAVASCRIPT
========================= */

function escapeJS(value) {

  return String(
    value ?? ""
  )
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /"/g,
      '\\"'
    );
}

</script>

</body>
</html>
